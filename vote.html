<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick poll</title>
<style>
  :root{--bg:#07080d;--bg2:#11141f;--line:#232838;--text:#e8ecf3;--dim:#8a93a6;--violet:#a78bfa;--green:#5eead4;--coral:#fb7185}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px 40px}
  .wrap{max-width:560px;margin:0 auto}
  .kicker{color:var(--violet);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  h1{font-size:28px;margin:6px 0 22px}
  .q{background:var(--bg2);border:1px solid var(--line);border-left:5px solid var(--violet);border-radius:16px;padding:18px;margin-bottom:16px}
  .q p{margin:0 0 14px;font-size:18px;line-height:1.35}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{font:inherit;font-size:17px;font-weight:600;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
  button.on[data-v=agree]{background:var(--green);border-color:var(--green);color:#04221d}
  button.on[data-v=disagree]{background:var(--coral);border-color:var(--coral);color:#2a0710}
  .foot{color:var(--dim);font-size:15px;text-align:center;margin-top:18px;min-height:1.4em}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Quick poll</div>
  <h1>Agree or disagree?</h1>
  <div id="qs"></div>
  <div class="foot" id="foot">Tap to vote. You can change your mind.</div>
</div>
<script>
const QUESTIONS = /*QUESTIONS*/[];
let voter, mine = {};
try { voter = localStorage.getItem('voter'); mine = JSON.parse(localStorage.getItem('mine') || '{}'); } catch {}
if (!voter) {
  voter = (crypto.randomUUID?.() || Math.random().toString(36).slice(2) + Date.now().toString(36)).replace(/[^\w-]/g, '');
  try { localStorage.setItem('voter', voter); } catch {}
}
const qs = document.getElementById('qs'), foot = document.getElementById('foot');
QUESTIONS.forEach((t, q) => {
  const d = document.createElement('div');
  d.className = 'q';
  d.innerHTML = `<p></p><div class="btns"><button data-v="agree">Agree</button><button data-v="disagree">Disagree</button></div>`;
  d.querySelector('p').textContent = t;
  d.querySelectorAll('button').forEach(b => b.onclick = () => vote(q, mine[q] === b.dataset.v ? null : b.dataset.v));
  qs.appendChild(d);
});
function render() {
  [...qs.children].forEach((d, q) => d.querySelectorAll('button').forEach(b => b.classList.toggle('on', mine[q] === b.dataset.v)));
  const n = Object.values(mine).filter(Boolean).length;
  foot.textContent = n === QUESTIONS.length ? 'Thanks! Watch the screen 👀' : 'Tap to vote. You can change your mind.';
}
async function vote(q, v) {
  const prev = mine[q];
  mine[q] = v; render();
  try {
    const r = await fetch('vote', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ voter, q, v }) });
    if (!r.ok) throw 0;
    try { localStorage.setItem('mine', JSON.stringify(mine)); } catch {}
  } catch {
    mine[q] = prev; render();
    foot.textContent = 'Could not send your vote, please try again.';
  }
}
render();
</script>
</body>
</html>
